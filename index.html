<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محمد & مريم | Wedding Invitation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Amiri", serif;
  background: linear-gradient(135deg, #fff7fa, #fde8f0);
  color: #5b3041;
  text-align: center;
}

.container {
  width: 92%;
  max-width: 650px;
  margin: 30px auto;
  padding: 30px 20px 40px;
  background: rgba(255,255,255,.88);
  border-radius: 28px;
  box-shadow: 0 10px 35px rgba(100,40,65,.15);
}

.ornament {
  font-size: 28px;
  color: #c47b96;
  margin-bottom: 10px;
}

h1 {
  margin: 5px 0;
  font-family: "Cormorant Garamond", serif;
  font-size: 58px;
  color: #9c526f;
}

.subtitle {
  font-size: 21px;
  margin: 5px 0 25px;
}

.photo {
  width: 100%;
  max-height: 500px;
  object-fit: cover;
  border-radius: 22px;
  display: block;
  margin: 0 auto 25px;
  box-shadow: 0 8px 25px rgba(100,40,65,.18);
}

.invite {
  font-size: 22px;
  line-height: 1.9;
}

.details {
  margin: 25px 0;
  padding: 20px;
  border-top: 1px solid #e8b8c9;
  border-bottom: 1px solid #e8b8c9;
}

.detail {
  margin: 12px 0;
  font-size: 20px;
}

.countdown {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 25px 0;
}

.box {
  min-width: 75px;
  padding: 12px 8px;
  background: #f9dce7;
  border-radius: 15px;
}

.box strong {
  display: block;
  font-size: 27px;
  color: #914b68;
}

.box span {
  font-size: 14px;
}

.map {
  display: inline-block;
  margin: 10px 0 20px;
  padding: 12px 25px;
  background: #a95d7b;
  color: white;
  text-decoration: none;
  border-radius: 25px;
  font-size: 18px;
}

button {
  border: none;
  background: #f1c4d4;
  color: #653548;
  padding: 12px 25px;
  border-radius: 25px;
  font-family: "Amiri", serif;
  font-size: 17px;
  cursor: pointer;
}

.footer {
  margin-top: 25px;
  font-size: 18px;
  color: #9c526f;
}

@media (max-width: 500px) {
  h1 {
    font-size: 46px;
  }

  .invite {
    font-size: 19px;
  }

  .photo {
    max-height: 420px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="ornament">♡ ❀ ♡</div>

  <h1>محمد & مريم</h1>

  <div class="subtitle">بكل الحب ندعوكم لمشاركتنا أجمل أيام حياتنا</div>

  <img src="photo.jpg" alt="محمد ومريم" class="photo">

  <div class="invite">
    يسعدنا ويشرفنا حضوركم ومشاركتنا فرحتنا
    في يوم زفافنا
  </div>

  <div class="details">
    <div class="detail">📅 <strong>الخميس 1 أكتوبر 2026</strong></div>
    <div class="detail">🕖 <strong>الساعة 7:00 مساءً</strong></div>
    <div class="detail">📍 <strong>قاعة لادونا - دار المركبات</strong></div>
    <div class="detail">القاهرة</div>
  </div>

  <div class="countdown">
    <div class="box">
      <strong id="days">0</strong>
      <span>يوم</span>
    </div>

    <div class="box">
      <strong id="hours">0</strong>
      <span>ساعة</span>
    </div>

    <div class="box">
      <strong id="minutes">0</strong>
      <span>دقيقة</span>
    </div>

    <div class="box">
      <strong id="seconds">0</strong>
      <span>ثانية</span>
    </div>
  </div>

  <a class="map"
     href="https://www.google.com/maps/search/?api=1&query=قاعة+لادونا+دار+المركبات+القاهرة"
     target="_blank">
    📍 موقع القاعة
  </a>

  <br>

  <button onclick="toggleMusic()" id="musicButton">
    🎵 تشغيل الموسيقى
  </button>

  <audio id="music" loop>
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <div class="footer">
    وجودكم هو أجمل هدية لنا 🤍
    <br>
    محمد & مريم
  </div>

</div>

<script>
const weddingDate = new Date("2026-10-01T19:00:00+03:00").getTime();

function updateCountdown() {
  const now = new Date().getTime();
  const distance = weddingDate - now;

  if (distance <= 0) {
    document.getElementById("days").textContent = 0;
    document.getElementById("hours").textContent = 0;
    document.getElementById("minutes").textContent = 0;
    document.getElementById("seconds").textContent = 0;
    return;
  }

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((distance / (1000 * 60)) % 60);
  const seconds = Math.floor((distance / 1000) % 60);

  document.getElementById("days").textContent = days;
  document.getElementById("hours").textContent = hours;
  document.getElementById("minutes").textContent = minutes;
  document.getElementById("seconds").textContent = seconds;
}

updateCountdown();
setInterval(updateCountdown, 1000);

function toggleMusic() {
  const music = document.getElementById("music");
  const button = document.getElementById("musicButton");

  if (music.paused) {
    music.play();
    button.textContent = "⏸ إيقاف الموسيقى";
  } else {
    music.pause();
    button.textContent = "🎵 تشغيل الموسيقى";
  }
}
</script>

</body>
</html>
